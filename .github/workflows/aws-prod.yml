name: Deploy Admin UI to Amazon EC2 Prod

on:
  push:
    branches: ["master"]
  workflow_dispatch:

env:
  EC2_HOST: 3.231.184.22
  DOMAIN: manager.aicomics.art
  BUILD_DIR: build
  DEPLOY_ROOT: /var/www/aicomics-manager-ui
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

permissions:
  contents: read

concurrency:
  group: deploy-admin-prod
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Notify Feishu - Started
        continue-on-error: true
        uses: negentropy-flow/github-actions/feishu-notifier@main
        with:
          pipeline_name: aicomics-manager-ui
          url: ${{ secrets.FEISHU_BOT_WEBHOOK_URL }}
          status: STARTED
          template: blue

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Validate build output
        run: |
          test -f "${BUILD_DIR}/index.html"
          test -d "${BUILD_DIR}/assets"

      - name: Package build output
        run: tar -C "$BUILD_DIR" -czf "$RUNNER_TEMP/aicomics-manager-ui.tar.gz" .

      - name: Configure SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          : "${EC2_HOST:?EC2_HOST is empty or not configured}"
          : "${EC2_SSH_PRIVATE_KEY:?EC2_SSH_PRIVATE_KEY secret is empty or not configured for the production environment}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key
          ssh-keyscan -H "$EC2_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload and activate release
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          : "${EC2_USER:?EC2_USER secret is empty or not configured for the production environment}"
          REMOTE_ARCHIVE="/tmp/aicomics-manager-ui-${GITHUB_SHA}.tar.gz"

          scp \
            -i ~/.ssh/ec2_deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/aicomics-manager-ui.tar.gz" \
            "$EC2_USER@$EC2_HOST:$REMOTE_ARCHIVE"

          ssh \
            -i ~/.ssh/ec2_deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            bash -s -- \
            "$REMOTE_ARCHIVE" \
            "$GITHUB_SHA" \
            "$DEPLOY_ROOT" \
            "$DOMAIN" \
            < .github/scripts/deploy-nginx.sh

      - name: Notify Feishu - Succeeded
        if: success()
        continue-on-error: true
        uses: negentropy-flow/github-actions/feishu-notifier@main
        with:
          pipeline_name: aicomics-manager-ui
          url: ${{ secrets.FEISHU_BOT_WEBHOOK_URL }}
          status: SUCCEEDED
          template: green

      - name: Notify Feishu - Failed
        if: failure()
        continue-on-error: true
        uses: negentropy-flow/github-actions/feishu-notifier@main
        with:
          pipeline_name: aicomics-manager-ui
          url: ${{ secrets.FEISHU_BOT_WEBHOOK_URL }}
          status: FAILED
          template: red
